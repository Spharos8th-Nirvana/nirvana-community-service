plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.nirvana'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM (Bill of Materials) - 의존성 버전 일괄 관리
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    // =========================================================================
    // Spring Boot & Spring Cloud - 웹 API, 모니터링, 중앙 설정
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'     // Spring MVC 기반 REST API와 웹 서버
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // 요청 DTO @Valid 검증 (COM-NFR-09)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크, 메트릭 등 운영 상태 확인
    implementation 'org.springframework.cloud:spring-cloud-starter-config'  // Config Server에서 서비스 설정 가져오기
    // =========================================================================
    // 요청 추적 - Micrometer Tracing (Brave, W3C traceparent). 외부 수집 서버로 내보내지 않는다.
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'  // Trace ID 생성·전달, 로그 연동 자동 설정
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'                  // Micrometer Tracing을 Brave로 구현
    // =========================================================================
    // API 문서화 - OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'  // OpenAPI 문서 생성 및 Swagger UI 제공
    // =========================================================================
    // 데이터베이스 - JPA, MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // JPA(Hibernate)로 DB 테이블과 객체 연결
    runtimeOnly 'com.mysql:mysql-connector-j'                                // MySQL 접속 드라이버 (실행할 때만 필요)
    // =========================================================================
    // 반복 코드 줄이기 - Lombok
    compileOnly 'org.projectlombok:lombok'                                   // 컴파일할 때 Lombok 애너테이션 사용
    annotationProcessor 'org.projectlombok:lombok'                           // 컴파일 중 Getter, Setter, Builder 등 생성
    // =========================================================================
    // 테스트 - JUnit, MockMvc, JPA(H2)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'  // JUnit, AssertJ, MockMvc 등 Spring MVC 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'  // @DataJpaTest로 JPA 저장·조회 테스트
    testRuntimeOnly 'com.h2database:h2'                                             // 테스트용 메모리 DB (MySQL 없이 실행)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'                    // Gradle에서 JUnit 테스트 실행
}

tasks.named('test') {
    useJUnitPlatform()
}
