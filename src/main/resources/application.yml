server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: community-service
  profiles:
    default: local
  cloud:
    config:
      enabled: false
  # DDL 컬럼이 camelCase라 Entity 필드 이름을 그대로 테이블·컬럼 이름으로 쓴다. (기본값은 snake_case로 바꾼다)
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  # 목록 요청 page는 0부터, size 기본 20·최대 100. 100을 넘으면 100으로 처리된다. (COM-NFR-02, COM-NFR-08)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

# MongoDB는 집계 수 읽기용이라 꺼져도 서비스는 동작한다. 전체 health 판정(/actuator/health)에서 뺀다.
management:
  health:
    mongodb:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13307}/nirvana_community?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:community}
    password: ${DB_PASSWORD:community}
  # 게시글 집계 수(조회수·좋아요 수·댓글 수)를 읽는 MongoDB. 로컬 컨테이너는 인증 없이 띄운다.
  # serverSelectionTimeoutMS: MongoDB에 연결하지 못할 때 기다리는 시간. 기본값 30초면 목록·상세가 그만큼 멈춘다.
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27117}/nirvana_community?serverSelectionTimeoutMS=2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: config-server
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
